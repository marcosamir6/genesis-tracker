<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قراءة سفر التكوين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d2a44; --muted:#6b7589; --paper:#f2f5f9; --card:#fff; --line:#d9e0ea;
    --done:#1f7a6b; --done-bg:#e3f3ef; --gold:#b8892b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8ecf4; --muted:#9aa5ba; --paper:#121826; --card:#1a2236; --line:#2c3652;
           --done:#5ccbb5; --done-bg:#183a3a; --gold:#e0b45a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Cairo,system-ui,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:28px 18px 8px;max-width:760px;margin:0 auto}
  h1{font-family:Amiri,serif;font-size:2.1rem;margin:0;line-height:1.3}
  header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
  main{max-width:760px;margin:0 auto;padding:12px 10px 40px}
  .wrap{background:var(--card);border:1px solid var(--line);border-radius:12px}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  th,td{border-bottom:1px solid var(--line);padding:0;text-align:center}
  tr:last-child td{border-bottom:0}
  th.ch,td.ch{position:sticky;right:0;background:var(--card);z-index:1;border-left:1px solid var(--line);
              width:68px;font-weight:600;color:var(--gold);font-size:.9rem}
  thead th{padding:10px 4px;font-weight:700;font-size:.95rem;overflow-wrap:anywhere;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--card);border-bottom:1px solid var(--line)}
  thead th.ch{z-index:3}
  thead .cnt{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
  td.ch{padding:0 8px}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
        width:100%;height:68px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;
        -webkit-tap-highlight-color:transparent}
  .box{width:34px;height:34px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;
       font-size:1.2rem;font-weight:700;color:transparent;transition:background .15s,border-color .15s}
  .cell:hover .box{border-color:var(--done)}
  .cell.on .box{background:var(--done);border-color:var(--done);color:var(--card)}
  .cell.on{background:var(--done-bg)}
  .when{font-size:.62rem;padding:0 2px;color:var(--muted);line-height:1.2;min-height:.8em}
  .cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
  .bar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .bar input{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
             background:var(--card);color:var(--ink);font:inherit}
  .bar button{padding:10px 16px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);
              font:inherit;font-weight:600;cursor:pointer}
  #status{font-size:.78rem;color:var(--muted);margin-top:10px;min-height:1.2em}
  #status.err{color:#c0392b}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>سفر التكوين</h1>
  <p>علّم على الأصحاح بعد ما تقرأه، وهيظهر للكل.</p>
</header>
<main>
  <div class="wrap"><table id="grid"></table></div>
  <form class="bar" id="addForm">
    <input id="newName" placeholder="اسم شخص جديد" maxlength="30" autocomplete="off">
    <button type="submit">إضافة شخص</button>
  </form>
  <div id="status"></div>
</main>
<script>
const CHAPTERS = 50; // عدد أصحاحات سفر التكوين
const API = "/api/state";
let state = { people: [], checks: {} };
let busy = 0;

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (iso) => new Date(iso).toLocaleString("ar-EG", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });

function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.className = err ? "err" : ""; }

function render() {
  const { people, checks } = state;
  let h = "<thead><tr><th class='ch'></th>";
  for (const p of people) {
    let n = 0; for (let c = 1; c <= CHAPTERS; c++) if (checks[p.id + ":" + c]) n++;
    h += `<th>${esc(p.name)}<span class="cnt">${n} من ${CHAPTERS}</span></th>`;
  }
  h += "</tr></thead><tbody>";
  for (let c = 1; c <= CHAPTERS; c++) {
    h += `<tr><td class="ch">أصحاح ${c.toLocaleString("ar-EG")}</td>`;
    for (const p of people) {
      const t = checks[p.id + ":" + c];
      h += `<td><button class="cell${t ? " on" : ""}" data-p="${p.id}" data-c="${c}" aria-pressed="${!!t}" aria-label="${esc(p.name)} أصحاح ${c}">
        <span class="box">✓</span><span class="when">${t ? fmt(t) : ""}</span></button></td>`;
    }
    h += "</tr>";
  }
  $("grid").innerHTML = h + "</tbody>";
}

async function api(method, body) {
  const r = await fetch(API, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  if (busy) return;
  try { state = await api("GET"); render(); setStatus("آخر تحديث: " + new Date().toLocaleTimeString("ar-EG", { hour: "numeric", minute: "2-digit" })); }
  catch { setStatus("مش قادر يحمّل البيانات. جرّب تاني بعد شوية.", true); }
}

async function send(body, optimistic) {
  busy++;
  const backup = structuredClone(state);
  if (optimistic) { optimistic(); render(); }
  try { state = await api("POST", body); setStatus("اتحفظ ✓"); }
  catch { state = backup; setStatus("ماتحفظش. اتأكد من النت وجرّب تاني.", true); }
  busy--; render();
}

$("grid").addEventListener("click", (e) => {
  const b = e.target.closest(".cell"); if (!b) return;
  const k = b.dataset.p + ":" + b.dataset.c, done = !state.checks[k];
  send({ action: "set", person: b.dataset.p, chapter: +b.dataset.c, done },
       () => { if (done) state.checks[k] = new Date().toISOString(); else delete state.checks[k]; });
});

$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("newName").value.trim(); if (!name) return;
  $("newName").value = "";
  send({ action: "addPerson", name });
});

load();
setInterval(load, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
