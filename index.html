<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المتابعة الروحية</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1d2a44">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a44;--muted:#6b7589;--paper:#f2f5f9;--card:#fff;--line:#d9e0ea;--done:#1f7a6b;--done-bg:#e3f3ef;--gold:#b8892b;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf4;--muted:#9aa5ba;--paper:#121826;--card:#1a2236;--line:#2c3652;--done:#5ccbb5;--done-bg:#183a3a;--gold:#e0b45a;--red:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Cairo,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{max-width:760px;margin:0 auto;padding:22px 14px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-family:Amiri,serif;font-size:2rem;margin:0;line-height:1.3}
#auth{font-size:.85rem;white-space:nowrap;padding-top:8px}
main{max-width:760px;margin:0 auto;padding:6px 10px 40px}
.lnk{background:none;border:0;color:var(--done);font:inherit;font-weight:600;cursor:pointer;padding:4px}.lnk.red{color:var(--red)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select,input:not([type=checkbox]){width:100%;padding:10px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center}tr:last-child td{border-bottom:0}
thead th{padding:10px 4px;font-size:.95rem;overflow-wrap:anywhere;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--card);border-bottom:1px solid var(--line)}
thead th.me{color:var(--done)}
td.ch,th.ch{position:sticky;right:0;background:var(--card);z-index:1;border-left:1px solid var(--line);width:88px;font-weight:600;color:var(--gold);font-size:.88rem;padding:0 6px}
thead th.ch{z-index:3}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:72px;padding:4px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
div.cell{cursor:default}
.box{width:32px;height:32px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:transparent}
button.cell:hover .box{border-color:var(--done)}
.cell.on .box{background:var(--done);border-color:var(--done);color:var(--card)}.cell.on{background:var(--done-bg)}
.when{font-size:.6rem;color:var(--muted);line-height:1.2;min-height:.8em;padding:0 2px}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.rx{font-size:.75rem;min-height:.95em;line-height:1}
#pop{position:fixed;z-index:20;display:flex;gap:2px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#pop button{background:none;border:0;font-size:1.6rem;padding:4px 9px;border-radius:20px;cursor:pointer;color:var(--ink)}#pop button.sel{background:var(--done-bg)}
.card label{display:inline-block;margin:0 0 8px 12px}
.stat{padding:14px 4px;font-size:1.15rem;font-weight:700}
.adm td{padding:10px 12px;text-align:start}.adm small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card b{display:block;margin-bottom:10px}
button.go,.card button:not(.lnk),dialog button:not(.lnk){padding:10px 16px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);font:inherit;font-weight:600;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,340px)}
dialog h3{margin:0 0 12px}.err,#status.err{color:var(--red)}.err{font-size:.85rem;min-height:1.2em}
#status{font-size:.78rem;color:var(--muted);min-height:1.2em}
</style>
</head>
<body>
<header><div><h1>المتابعة الروحية</h1></div><div id="auth"></div></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div id="status"></div>
</main>
<dialog id="dlg"><form id="lf">
  <h3>تسجيل الدخول</h3>
  <input name="username" placeholder="اسم المستخدم" required dir="ltr" autocapitalize="none" autocomplete="username">
  <input name="password" type="password" placeholder="كلمة السر" required autocomplete="current-password">
  <div id="lerr" class="err"></div>
  <button>دخول</button> <button type="button" class="lnk" id="cx">إلغاء</button>
</form></dialog>
<script>
const API = "/api/state";
const BOOKS = "سفر تكوين:50,سفر خروج:40,سفر لاويين:27,سفر عدد:36,سفر تثنية:34,سفر يشوع:24,سفر قضاه:21,سفر راعوث:4,سفر صموئيل أول:31,سفر صموئيل ثاني:24,سفر ملوك أول:22,سفر ملوك ثاني:25,سفر أخبار أيام أول:29,سفر أخبار أيام ثاني:36,سفر عزرا:10,سفر نحميا:13,سفر طوبيت:14,سفر يهوديت:16,سفر أستير + تتمة أستير:17,سفر أيوب:42,سفر مزامير + مز151:151,سفر أمثال:31,سفر الجامعة:12,سفر نشيد الأنشاد:8,سفر الحكمة:19,سفر يشوع ابن سيراخ:51,سفر إشعياء:66,سفر إرميا:52,سفر مراثي إرميا:5,سفر نبوة باروخ:6,سفر حزقيال:48,سفر دانيال + تتمة دانيال:15,سفر هوشع:14,سفر يوئيل:3,سفر عاموس:9,سفر عوبديا:1,سفر يونان:4,سفر ميخا:7,سفر ناحوم:3,سفر حبقوق:3,سفر صفنيا:3,سفر حجي:2,سفر زكريا:14,سفر ملاخي:4,سفر مكابيين أول:16,سفر مكابيين ثاني:15,إنجيل متى:28,إنجيل مرقس:16,إنجيل لوقا:24,إنجيل يوحنا:21,سفر أعمال الرسل:28,الرسالة إلى أهل رومية:16,الرسالة الأولى إلى أهل كورنثوس:16,الرسالة الثانية إلى أهل كورنثوس:13,الرسالة إلى أهل غلاطية:6,الرسالة إلى أهل أفسس:6,الرسالة إلى أهل فيلبى:4,الرسالة إلى أهل كولوسي:4,الرسالة الأولى إلى أهل تسالونيكي:5,الرسالة الثانية إلى أهل تسالونيكي:3,الرسالة الأولى إلى تيموثاوس:6,الرسالة الثانية إلى تيموثاوس:4,الرسالة إلى تيطس:3,الرسالة إلى فليمون:1,الرسالة إلى عبرانيين:13,رسالة يعقوب الرسول:5,رسالة بطرس الأولى:5,رسالة بطرس الثانية:3,رسالة يوحنا الأولى:5,رسالة يوحنا الثانية:1,رسالة يوحنا الثالثة:1,رسالة يهوذا:1,سفر رؤيا يوحنا:22".split(",").map(s => { const [n, c] = s.split(":"); return [n, +c]; });
const OT = 46; // أول 46 سفر = العهد القديم، والباقي العهد الجديد
const SLOTS = [["morning", "صباحًا"], ["evening", "مساءً"], ["liturgy", "القداس الإلهي"], ["confession", "الاعتراف"], ["service", "الخدمة"]];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fmt = (iso) => new Date(iso).toLocaleString("ar-EG", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const num = (n) => n.toLocaleString("ar-EG");
const rg = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => "أصحاح " + num(a + i));
const LBL = { 18: [...rg(1, 10), "تتمة أصحاح " + num(10), ...rg(11, 16)], 31: [...rg(1, 3), "تتمة أصحاح " + num(3), ...rg(4, 14)] };
let S = { needsSetup: false, users: [] }, tab = "read", book = Math.min(+ls.get("book") || 0, BOOKS.length - 1), pdate = ymd(new Date()), period = "day", busy = 0, first = true;
let me = null; try { me = JSON.parse(ls.get("me")); } catch {}
const msg = (m, bad) => { $("status").textContent = m; $("status").className = bad ? "err" : ""; };

async function api(method, body) {
  const r = await fetch(API, { method, cache: "no-store", body: body ? JSON.stringify(body) : undefined,
    headers: { "content-type": "application/json", ...(me ? { authorization: "Bearer " + me.token } : {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "حصل خطأ"), { status: r.status });
  return j;
}

function grid(rows, kind, keyOf) {
  const U = S.users, f = kind === "read" ? "reads" : "prayers", mine = (u) => me && u.username === me.username;
  let h = `<div class="wrap"><table><thead><tr><th class="ch"></th>${U.map((u) => `<th class="${mine(u) ? "me" : ""}">${esc(u.name)}</th>`).join("")}</tr></thead><tbody>`;
  for (const [label, id] of rows) {
    const key = keyOf(id);
    h += `<tr><td class="ch">${label}</td>`;
    for (const u of U) {
      const t = u[f][key], inner = `<span class="box">✓</span><span class="when">${t ? fmt(t) : ""}</span><span class="rx">${t ? rxHtml(u.username, kind, key) : ""}</span>`;
      h += `<td>${mine(u) ? `<button class="cell${t ? " on" : ""}" data-k="${kind}" data-key="${key}" aria-pressed="${!!t}">${inner}</button>` : `<div class="cell${t ? " on" : ""}"${t && me ? ` data-rx="${u.username}|${kind}|${key}"` : ""}>${inner}</div>`}</td>`;
    }
    h += "</tr>";
  }
  return h + "</tbody></table></div>";
}
const hint = () => me ? `<p class="hint">اضغط مطوّلًا على علامة حد تاني عشان تتفاعل معاها ❤️ 👏 🙏</p>` : `<p class="hint">تقدر تشوف قراءة الكل، وسجّل دخولك عشان تعلّم على عمودك إنت.</p>`;

function readV() {
  const opt = (a, b) => BOOKS.slice(a, b).map((x, i) => `<option value="${a + i}"${a + i === book ? " selected" : ""}>${x[0]}</option>`).join("");
  const rows = Array.from({ length: BOOKS[book][1] }, (_, i) => [(LBL[book] || [])[i] || "أصحاح " + num(i + 1), i + 1]);
  return `<select id="book"><optgroup label="العهد القديم">${opt(0, OT)}</optgroup><optgroup label="الأناجيل">${opt(OT, OT + 4)}</optgroup><optgroup label="أعمال الرسل والرسائل والرؤيا">${opt(OT + 4, BOOKS.length)}</optgroup></select>` + hint() + grid(rows, "read", (c) => book + "|" + c);
}
function prayV() {
  return `<input type="date" id="pd" value="${pdate}" max="${ymd(new Date())}">` + hint() + grid(SLOTS.map(([k, l]) => [l, k]), "pray", (s) => pdate + "|" + s);
}
function statsV() {
  const now = new Date(), pre = period === "day" ? ymd(now) : period === "month" ? ymd(now).slice(0, 7) : String(now.getFullYear());
  const C = S.users.map((u) => {
    const c = { chap: Object.values(u.reads).filter((t) => ymd(new Date(t)).startsWith(pre)).length };
    for (const k in u.prayers) { const [d, s] = k.split("|"); if (d.startsWith(pre)) c[s] = (c[s] || 0) + 1; }
    return c;
  });
  const rows = [["chap", "أصحاحات مقروءة"], ...SLOTS.map(([k, l]) => [k, k === "morning" || k === "evening" ? "صلاة " + l.replace("ًا", "ا").replace("ءً", "اء") : l])];
  const tabs = [["day", "اليوم"], ["month", "الشهر"], ["year", "السنة"]].map(([k, l]) => `<button data-p="${k}" class="${period === k ? "on" : ""}">${l}</button>`).join("");
  return `<div class="tabs">${tabs}</div><div class="wrap"><table><thead><tr><th class="ch"></th>${S.users.map((u) => `<th>${esc(u.name)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(([k, l]) => `<tr><td class="ch">${l}</td>${C.map((c) => `<td class="stat">${num(c[k] || 0)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
}
const userForm = (id, title, btn, admin) => `<form id="${id}" class="card"><b>${title}</b><input name="name" placeholder="الاسم الظاهر (مثلًا: جرجس)" required><input name="username" placeholder="اسم المستخدم بالإنجليزي (مثلًا girgis)" required dir="ltr" autocapitalize="none"><input name="password" placeholder="كلمة السر" required>${admin ? `<label><input type="checkbox" name="admin"> مدير</label><br><br>` : ""}<button>${btn}</button></form>`;
function adminV() {
  return `<div class="wrap"><table class="adm">${S.users.map((u) => `<tr><td>${esc(u.name)} <small>@${u.username}${u.admin ? " · مدير" : ""}</small></td><td><button class="lnk" data-pw="${u.username}">كلمة سر جديدة</button>${u.username === me.username ? "" : ` <button class="lnk red" data-del="${u.username}">حذف</button>`}</td></tr>`).join("")}</table></div>` + userForm("addU", "إضافة حساب جديد", "إضافة", true) + remV();
}
const setupV = () => `<p class="hint">أول مرة: اعمل حساب المدير. هيقدر يضيف الباقيين ويمسحهم بعد كده.</p>` + userForm("su", "إنشاء حساب المدير", "إنشاء", false);

function render() {
  if (tab === "admin" && !(me && me.admin)) tab = "read";
  $("auth").innerHTML = me ? `${esc(me.name)} <button class="lnk" id="out">خروج</button>` : `<button class="lnk" id="in">دخول</button>`;
  const T = [["read", "القراءة"], ["pray", "الصلاة"], ["stats", "الإحصاءات"]]; if (me && me.admin) T.push(["admin", "الإدارة"]);
  $("tabs").innerHTML = S.needsSetup ? "" : T.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("");
  const bell = me && !S.needsSetup && "PushManager" in window && ls.get("push") !== "1" ? `<p class="hint"><button class="lnk" id="bell">🔔 فعّل الإشعارات</button> عشان يوصلك تنبيه بصوت لما حد يعلّم قراءة أو صلاة.</p>` : "";
  $("view").innerHTML = bell + (S.needsSetup ? setupV() : { read: readV, pray: prayV, stats: statsV, admin: adminV }[tab]());
}

async function load() {
  if (busy) return;
  try {
    const j = await api("GET"), changed = JSON.stringify(j) !== JSON.stringify(S); S = j;
    const typing = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName) && $("view").contains(document.activeElement);
    if (first || (changed && !typing)) render();
    first = false; msg("آخر تحديث: " + new Date().toLocaleTimeString("ar-EG", { hour: "numeric", minute: "2-digit" }));
  } catch { msg("مش قادر يحمّل البيانات. جرّب تاني بعد شوية.", true); }
}
async function act(body, bak) {
  busy++; let er = null;
  try {
    const j = await api("POST", body);
    if (j.token) { me = { ...j.me, token: j.token }; ls.set("me", JSON.stringify(me)); }
    S = j; msg("اتحفظ ✓");
  } catch (e) {
    er = e.message; if (bak) S = bak;
    if (e.status === 401 && body.action !== "login") { me = null; ls.del("me"); er = "انتهت الجلسة، سجّل الدخول تاني"; }
    msg(er, true);
  }
  busy--;
  if (!(er && /^(addUser|setup|remAdd)$/.test(body.action))) render();
  return er;
}

const u8 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const PN = { morning: "صلاة الصباح", evening: "صلاة المساء" };
function labelOf(kind, key) {
  const [a, b] = key.split("|");
  if (kind === "read") return "قرأ " + BOOKS[+a][0] + " — " + ((LBL[+a] || [])[b - 1] || "أصحاح " + num(+b));
  const s = SLOTS.find((x) => x[0] === b);
  return "سجّل " + (PN[b] || s[1]) + (a === ymd(new Date()) ? "" : " (" + a + ")");
}
async function enablePush() {
  try {
    if (!("Notification" in window) || (await Notification.requestPermission()) !== "granted") return msg("لازم تسمح بالإشعارات من إعدادات المتصفح", true);
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch(API + "?vapid=1", { cache: "no-store" })).json();
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(key) }));
    if (!(await act({ action: "subscribe", endpoint: sub.endpoint }))) { ls.set("push", "1"); render(); msg("اتفعّلت الإشعارات ✓"); }
  } catch { msg("مقدرتش أفعّل الإشعارات", true); }
}
async function unsubPush() {
  try { const s = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (s) await api("POST", { action: "unsubscribe", endpoint: s.endpoint }); } catch {}
  ls.del("push");
}

const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
function rxHtml(owner, kind, key) {
  const c = {};
  for (const u of S.users) { const e = (u.rx || {})[owner + "|" + kind + "|" + key]; if (e) c[e] = (c[e] || 0) + 1; }
  return Object.entries(c).map(([e, n]) => e + (n > 1 ? num(n) : "")).join(" ");
}
function remV() {
  const rows = (S.reminders || []).map((r) => `<tr><td>${esc(r.text)}<br><small>${r.time} · ${r.date ? r.date : r.days.length === 7 ? "كل يوم" : r.days.map((d) => DAYS[d]).join("، ")}${r.on === false ? " · موقوف" : ""}</small></td><td><button class="lnk" data-rt="${r.id}">${r.on === false ? "تشغيل" : "إيقاف"}</button> <button class="lnk" data-rn="${r.id}">جرّب</button> <button class="lnk red" data-rd="${r.id}">حذف</button></td></tr>`).join("");
  return `<h3>التذكيرات</h3><p class="hint">بتتبعت بتوقيت القاهرة لكل الأجهزة اللي فعّلت الإشعارات. زر "جرّب" بيبعتها فورًا.</p>` + (rows ? `<div class="wrap"><table class="adm">${rows}</table></div>` : "") +
    `<form id="addR" class="card"><b>تذكير جديد</b><input name="text" placeholder="نص الرسالة (مثلًا: ميعاد قراءة الإنجيل 📖)" required maxlength="120"><input type="time" name="time" required><div>${DAYS.map((d, i) => `<label><input type="checkbox" name="d${i}" checked> ${d}</label>`).join("")}</div><p class="hint">أو اختار تاريخ محدد (بيتجاهل الأيام):</p><input type="date" name="date"><button>إضافة التذكير</button></form>` +
    `<div class="card"><b>تشغيل الجدولة</b><p class="hint">التذكيرات المجدولة محتاجة خدمة مجانية (cron-job.org) تفتح الرابط ده كل دقيقة. مرة واحدة بس.</p>` +
    (S.cronKey ? `<input readonly id="cu" value="${esc(location.origin + "/api/state?cron=" + S.cronKey)}" onclick="this.select()"><p class="hint">الرابط ده سرّي، متشاركوش مع حد.</p>` : `<button class="lnk" data-ci="1">اعرض رابط الجدولة</button>`) + `</div>`;
}
let popT = 0, lp = null;
function showPop(c) {
  const ref = c.dataset.rx, mine = (S.users.find((x) => x.username === me.username).rx || {})[ref];
  const old = $("pop"); if (old) old.remove();
  const p = document.createElement("div"); p.id = "pop"; p.dataset.rx = ref;
  p.innerHTML = ["❤️", "👏", "🙏"].map((e) => `<button data-em="${e}" class="${mine === e ? "sel" : ""}">${e}</button>`).join("") + (mine ? `<button data-em="">✕</button>` : "");
  document.body.appendChild(p);
  const b = c.getBoundingClientRect(), w = p.offsetWidth;
  p.style.left = Math.max(6, Math.min(innerWidth - w - 6, b.left + b.width / 2 - w / 2)) + "px";
  p.style.top = Math.max(6, b.top - 56) + "px";
  popT = Date.now(); if (navigator.vibrate) navigator.vibrate(15);
}
function react(ref, em) {
  const [o, k, ...r] = ref.split("|"), key = r.join("|"), u = S.users.find((x) => x.username === me.username), bak = structuredClone(S);
  u.rx = u.rx || {}; if (em) u.rx[ref] = em; else delete u.rx[ref];
  render();
  const label = k === "read" ? "على قراءتك " + BOOKS[+r[0]][0] + " — " + ((LBL[+r[0]] || [])[r[1] - 1] || "أصحاح " + num(+r[1])) : "على تسجيلك " + (PN[r[1]] || SLOTS.find((x) => x[0] === r[1])[1]);
  act({ action: "react", owner: o, kind: k, key, emoji: em, label }, bak);
}
let lpX = 0, lpY = 0, swallow = false;
document.addEventListener("pointerdown", (e) => {
  const c = e.target.closest("[data-rx]"); if (!c || !me) return;
  lpX = e.clientX; lpY = e.clientY;
  if (lp) clearTimeout(lp);
  lp = setTimeout(() => { lp = null; swallow = true; showPop(c); setTimeout(() => { swallow = false; }, 1500); }, 450);
});
document.addEventListener("pointermove", (e) => { if (lp && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 12) { clearTimeout(lp); lp = null; } }, { passive: true });
["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, () => { if (lp) { clearTimeout(lp); lp = null; } }, { passive: true }));
document.addEventListener("scroll", () => { if (lp) { clearTimeout(lp); lp = null; } }, { passive: true, capture: true });
document.addEventListener("contextmenu", (e) => { if (e.target.closest("[data-rx]")) e.preventDefault(); });

document.addEventListener("click", (e) => {
  if (swallow) { swallow = false; return; }
  const pop = $("pop"); if (pop && Date.now() - popT > 500 && !pop.contains(e.target)) pop.remove();
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if ("em" in d) { const p = $("pop"); if (p) { react(p.dataset.rx, d.em); p.remove(); } }
  else if (d.t) { tab = d.t; render(); }
  else if (d.p) { period = d.p; render(); }
  else if (t.id === "bell") enablePush();
  else if (t.id === "in") $("dlg").showModal();
  else if (t.id === "cx") $("dlg").close();
  else if (t.id === "out") { unsubPush().finally(() => { me = null; ls.del("me"); render(); }); }
  else if (d.key) {
    const u = S.users.find((x) => x.username === me.username), f = d.k === "read" ? "reads" : "prayers", on = !u[f][d.key], bak = structuredClone(S);
    if (on) u[f][d.key] = new Date().toISOString(); else delete u[f][d.key];
    render(); act({ action: "set", kind: d.k, key: d.key, done: on, label: on ? labelOf(d.k, d.key) : "" }, bak);
  }
  else if (d.pw) { const p = prompt("كلمة السر الجديدة لـ " + d.pw); if (p) act({ action: "passwd", username: d.pw, password: p }); }
  else if (d.del && confirm("تمسح الحساب ده بكل بياناته؟")) act({ action: "delUser", username: d.del });
  else if (d.ci) act({ action: "remInfo" });
  else if (d.rt) act({ action: "remToggle", id: d.rt });
  else if (d.rn) act({ action: "remNow", id: d.rn });
  else if (d.rd && confirm("تمسح التذكير ده؟")) act({ action: "remDel", id: d.rd });
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  if (f.id === "lf") { const er = await act({ action: "login", ...d }); $("lerr").textContent = er || ""; if (!er) { $("dlg").close(); f.reset(); if ("Notification" in window && Notification.permission === "granted") enablePush(); } }
  else if (f.id === "addU") act({ action: "addUser", ...d, admin: !!d.admin });
  else if (f.id === "su") act({ action: "setup", ...d });
  else if (f.id === "addR") act({ action: "remAdd", text: d.text, time: d.time, date: d.date || "", days: [0, 1, 2, 3, 4, 5, 6].filter((i) => d["d" + i]) });
});
document.addEventListener("change", (e) => {
  if (e.target.id === "book") { book = +e.target.value; ls.set("book", book); render(); }
  else if (e.target.id === "pd" && e.target.value) { pdate = e.target.value; render(); }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", () => load());
}
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
